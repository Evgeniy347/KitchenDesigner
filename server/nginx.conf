user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/wasm;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        types {
            application/wasm wasm;
        }

        # Brotli pre-compressed files. Requires nginx compiled with the brotli module
        # and brotli_static on; directive (uncomment when available):
        # location ~ \.wasm\.br$ {
        #     brotli off;
        #     types { }
        #     default_type application/wasm;
        #     add_header Content-Encoding br;
        #     expires 1y;
        #     add_header Cache-Control "public, immutable";
        # }
        #
        # location ~ \.js\.br$ {
        #     brotli off;
        #     types { }
        #     default_type application/javascript;
        #     add_header Content-Encoding br;
        #     expires 1y;
        #     add_header Cache-Control "public, immutable";
        # }
        #
        # location ~ \.data\.br$ {
        #     brotli off;
        #     types { }
        #     default_type application/octet-stream;
        #     add_header Content-Encoding br;
        #     expires 1y;
        #     add_header Cache-Control "public, immutable";
        # }

        location ~ \.wasm\.gz$ {
            gzip off;
            types { }
            default_type application/wasm;
            add_header Content-Encoding gzip;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.js\.gz$ {
            gzip off;
            types { }
            default_type application/javascript;
            add_header Content-Encoding gzip;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.data\.gz$ {
            gzip off;
            types { }
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|wasm|data|html|css|png|jpg|jpeg|gif|ico|svg|json)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://web:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /_blazor {
            proxy_pass http://web:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
