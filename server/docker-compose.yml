services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: kitchendb
      POSTGRES_USER: ${DB_USER:-kitchen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitchen-prod}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kitchen} -d kitchendb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__kitchendb: Host=db;Database=kitchendb;Username=${DB_USER:-kitchen};Password=${DB_PASSWORD:-kitchen-prod}
      WebGL__RootPath: /app/webgl
      ServerSave__Enabled: "true"
    ports:
      # MCP port for AI agents, exposed directly (HTTP goes through nginx)
      - "8081:8081"
    volumes:
      - appdata:/app/data
      - ./webgl:/app/webgl:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "23080:80"
      - "23443:443"
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  appdata:
  certbot-www:
