# Local debug stack: nginx serves Builds/WebGL_Debug straight from the host
# (bind mount — rebuild WebGL, refresh the browser, no docker rebuild).
# Usage:  docker compose -f docker-compose.local.yml up -d --build
# URLs:   http://localhost:8080         — site + WebGL (nginx)
#         ws://localhost:8081/hubs/mcp  — MCP port for agents (direct to web)
services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: kitchendb
      POSTGRES_USER: ${DB_USER:-kitchen}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitchen-local}
    volumes:
      - ./data/pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kitchen} -d kitchendb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__kitchendb: Host=db;Database=kitchendb;Username=${DB_USER:-kitchen};Password=${DB_PASSWORD:-kitchen-local}
      ASPNETCORE_ENVIRONMENT: Development
      WebGL__RootPath: /app/webgl
      ServerSave__Enabled: "true"
    ports:
      - "8081:8081"
    volumes:
      - appdata-local:/app/data
      - ../Builds/WebGL_Debug:/app/webgl:ro
      - ./KitchenServer.Web/wwwroot/app.css:/app/wwwroot/app.css:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  appdata-local:
